unique_name: Net Written Premium Prior Year
object_type: metric_calc
label: Net Written Premium Prior Year
description: Net Written Premium for the same fiscal period one year earlier.
expression: 'CASE WHEN ISEMPTY([Measures].[Net Written Premium]) THEN NULL

  ELSE (ParallelPeriod([Fiscal Date Dimension].[Fiscal Date Hierarchy].[Fiscal Year], 1, [Fiscal Date Dimension].[Fiscal
  Date Hierarchy].CurrentMember), [Measures].[Net Written Premium]) END'
format: $#,##0
